# This file contains selected Kconfig options for the application.

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

# --- nanoMODBUS ---
CONFIG_NANOMODBUS=y
CONFIG_NANOMODBUS_CLIENT=y
CONFIG_NANOMODBUS_TRANSPORT_SERIAL=y
CONFIG_APP_MODBUS_INTER_POLL_DELAY_MS=40

# --- nanoMODBUS TCP Server ---
CONFIG_NANOMODBUS_SERVER=y
CONFIG_NANOMODBUS_TRANSPORT_TCP=y
CONFIG_NANOMODBUS_SERVER_TCP=y
CONFIG_NANOMODBUS_SERVER_TCP_STACK_SIZE=3072
CONFIG_NANOMODBUS_SERVER_TCP_PRIORITY=8
CONFIG_NANOMODBUS_SERVER_TCP_BACKLOG=4
CONFIG_NANOMODBUS_DIAGNOSTICS=y




# --- Logging (used by the composition root and the polling threads) ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y


# --- Thread Naming & Debugging ---
CONFIG_THREAD_NAME=y
CONFIG_DEBUG_THREAD_INFO=y

# --- Zbus ---
CONFIG_ZBUS=y

CONFIG_MAIN_STACK_SIZE=4096

# --- Networking Core & IPv4 ---
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_ETH_STM32_HAL=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IF_MAX_IPV4_COUNT=3

# --- Network Buffer and Stacks ---
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# --- Wi-Fi Subsystem (ESP-Hosted-MCU) ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP_HOSTED_MCU=y
CONFIG_ESP_HOSTED_MCU_INIT_PRIORITY=75
CONFIG_WIFI_ESP_HOSTED_MCU_AP_STA_MODE=y
CONFIG_ESP_HOSTED_MCU_EVENT_TASK_PRIORITY=-2
CONFIG_WIFI_NM_MAX_MANAGED_INTERFACES=2

# --- DHCPv4 Server (Soft-AP Client IP Allocation) ---
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_MAX_CONN=8
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_ZVFS_POLL_MAX=8
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_INSTANCES=1
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=8
CONFIG_NET_DHCPV4_SERVER_ADDR_LEASE_TIME=86400
CONFIG_NET_DHCPV4_SERVER_OPTION_ROUTER=y
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=0
CONFIG_NET_DHCPV4_SERVER_NAK_UNRECOGNIZED_REQUESTS=y

# -----------------------------------------------------------------------------
# Peripherals & System
# -----------------------------------------------------------------------------
CONFIG_DCACHE=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_DMA=y
CONFIG_SPI=y
CONFIG_SPI_STM32_INTERRUPT=y
CONFIG_UART_ASYNC_API=y
CONFIG_ADC_STM32_DMA=y

# --- UART RX ---
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# --- I2C & EEPROM Subsystems ---
CONFIG_I2C=y
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y

# --- microconf Persistent Storage Engine ---
CONFIG_MICROCONF=y
CONFIG_MICROCONF_BACKEND_EEPROM=y

# --- Real-Time Clock (RTC) Subsystem ---
CONFIG_RTC=y
CONFIG_RTC_STM32=y

# --- Zephyr Shell Subsystem ---
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=6144
CONFIG_SHELL_BACKENDS=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="brightc:~$ "
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_PRINTF_BUFF_SIZE=512

# --- System Reboot ---
CONFIG_REBOOT=y

CONFIG_PICOLIBC_IO_FLOAT=y

# --- Hardware FPU (Cortex-M7 FPv5-D16 Double Precision) ---
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# --- ARM CMSIS-DSP Library Support ---
CONFIG_CMSIS_DSP=y

# --- MicroSD Storage & FAT Filesystem ---
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=64


